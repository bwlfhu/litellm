apiVersion: v1
kind: ConfigMap
metadata:
  name: lucky-frpc-config-direct-20260918-v2
  namespace: lucky
immutable: true
data:
  frpc.toml: |
    serverAddr = "123.60.74.153"
    serverPort = 45217
    loginFailExit = false

    auth.method = "token"
    auth.additionalScopes = ["HeartBeats", "NewWorkConns"]
    auth.tokenSource.type = "file"
    auth.tokenSource.file.path = "/etc/frp/token"

    transport.tls.enable = true
    transport.tls.certFile = "/etc/frp/client.crt"
    transport.tls.keyFile = "/etc/frp/client.key"
    transport.tls.trustedCaFile = "/etc/frp/ca.crt"
    transport.tls.serverName = "frps-gateway"
    transport.poolCount = 1

    [[proxies]]
    name = "pma-frontend"
    type = "tcp"
    localIP = "pm-agent-frontend.pm-agent.svc.cluster.local"
    localPort = 3000
    remotePort = 19080

    [[proxies]]
    name = "pma-backend"
    type = "tcp"
    localIP = "pm-agent-backend.pm-agent.svc.cluster.local"
    localPort = 8000
    remotePort = 19081

    [[proxies]]
    name = "pms-web"
    type = "tcp"
    localIP = "web.pms.svc.cluster.local"
    localPort = 40000
    remotePort = 19082

    [[proxies]]
    name = "sso"
    type = "tcp"
    localIP = "casdoor.identity.svc.cluster.local"
    localPort = 8000
    remotePort = 19083

    [[proxies]]
    name = "pms-api"
    type = "tcp"
    localIP = "api.pms.svc.cluster.local"
    localPort = 40001
    remotePort = 19084

    [[proxies]]
    name = "litellm-inference-api"
    type = "tcp"
    localIP = "litellm-public-api.litellm.svc.cluster.local"
    localPort = 8080
    remotePort = 19085

    [[proxies]]
    name = "pdep"
    type = "tcp"
    localIP = "pdep-nginx.pdep.svc.cluster.local"
    localPort = 80
    remotePort = 19079
