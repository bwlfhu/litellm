apiVersion: v1
kind: Service
metadata:
  name: lucky-admin
  namespace: lucky
  labels:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
  ports:
    - name: admin
      port: 16601
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lucky-web
  namespace: lucky
  labels:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
  ports:
    - name: web
      port: 18443
      targetPort: web
      nodePort: 30443
      protocol: TCP
