apiVersion: v1
kind: Service
metadata:
  name: lucky-admin
  namespace: lucky
  labels:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
  ports:
    - name: admin
      port: 16601
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lucky-web
  namespace: lucky
  labels:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lucky
    app.kubernetes.io/instance: lucky
  ports:
    - name: web
      port: 18443
      targetPort: web
      protocol: TCP
    - name: pm-frontend
      port: 18444
      targetPort: pm-frontend
      protocol: TCP
    - name: pm-backend
      port: 18445
      targetPort: pm-backend
      protocol: TCP
    - name: pms
      port: 18446
      targetPort: pms
      protocol: TCP
    - name: sso
      port: 18447
      targetPort: sso
      protocol: TCP
    - name: pms-api
      port: 18448
      targetPort: pms-api
      protocol: TCP
