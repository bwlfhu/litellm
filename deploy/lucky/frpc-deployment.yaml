apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucky-frpc
  namespace: lucky
  labels:
    app.kubernetes.io/name: lucky-frpc
    app.kubernetes.io/instance: lucky-frpc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lucky-frpc
      app.kubernetes.io/instance: lucky-frpc
  template:
    metadata:
      annotations:
        config.kubernetes.io/revision: "direct-20260918-v2"
      labels:
        app.kubernetes.io/name: lucky-frpc
        app.kubernetes.io/instance: lucky-frpc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frpc
          image: ghcr.io/fatedier/frpc@sha256:99ece6a2b62cfc68731e0df289af804ff1c699911cfc47871856434f1d6d53ee
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /config/frpc.toml
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  wget -S -O /dev/null --header="Authorization: Bearer sk-frpc-healthcheck-invalid" --header="Connection: close" -T 10 http://litellm-public-api.litellm.svc.cluster.local:8080/v1/models 2>&1 | grep -qE 'HTTP/[0-9.]+ 401 ' || exit 1
                  wget -S -O /dev/null --header="Authorization: Bearer sk-frpc-healthcheck-invalid" --header="Connection: close" -T 10 https://autocode.allcam.com.cn/v1/models 2>&1 | grep -qE 'HTTP/[0-9.]+ 401 '
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  wget -S -O /dev/null --header="Authorization: Bearer sk-frpc-healthcheck-invalid" --header="Connection: close" -T 10 http://litellm-public-api.litellm.svc.cluster.local:8080/v1/models 2>&1 | grep -qE 'HTTP/[0-9.]+ 401 ' || exit 0
                  wget -S -O /dev/null --header="Authorization: Bearer sk-frpc-healthcheck-invalid" --header="Connection: close" -T 10 https://autocode.allcam.com.cn/v1/models 2>&1 | grep -qE 'HTTP/[0-9.]+ 401 '
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config/frpc.toml
              subPath: frpc.toml
              readOnly: true
            - name: credentials
              mountPath: /etc/frp
              readOnly: true
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: lucky-frpc-config-direct-20260918-v2
        - name: credentials
          secret:
            secretName: lucky-frpc-credentials
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
