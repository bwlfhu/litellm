apiVersion: v1
kind: Service
metadata:
  name: casdoor
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/part-of: identity
spec:
  selector:
    app.kubernetes.io/name: casdoor
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor
    app.kubernetes.io/part-of: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor
        app.kubernetes.io/part-of: identity
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine-casdoor-60b180625695
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: casdoor-postgres
          command: ["sh", "-c", "until pg_isready -h casdoor-postgres -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: casdoor
          image: docker.io/casbin/casdoor:3.105.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-conf
              mountPath: /conf
              readOnly: true
      volumes:
        - name: app-conf
          secret:
            secretName: casdoor-app-conf
            items:
              - key: app.conf
                path: app.conf
