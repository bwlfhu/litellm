apiVersion: v1
kind: Service
metadata:
  name: casdoor-public
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor-public
    app.kubernetes.io/part-of: identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: casdoor-public
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor-public
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor-public
    app.kubernetes.io/part-of: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor-public
        app.kubernetes.io/part-of: identity
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine-casdoor-60b180625695
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: casdoor-postgres
          command:
            - sh
            - -c
            - until pg_isready -h casdoor-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: casdoor
          image: docker.io/casbin/casdoor@sha256:fcc4b7bf301539da57b10c58d7f77be0397cd0f4f6f61da8111471636a647653
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app-conf
              mountPath: /conf
              readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: app-conf
          secret:
            secretName: casdoor-public-app-conf
            items:
              - key: app.conf
                path: app.conf
