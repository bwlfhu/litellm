apiVersion: v1
kind: Service
metadata:
  name: casdoor-postgres
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor-postgres
    app.kubernetes.io/part-of: identity
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: casdoor-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: casdoor-postgres
  namespace: identity
  labels:
    app.kubernetes.io/name: casdoor-postgres
    app.kubernetes.io/part-of: identity
spec:
  serviceName: casdoor-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: casdoor-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casdoor-postgres
        app.kubernetes.io/part-of: identity
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine-casdoor-60b180625695
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: casdoor-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-home-retain
        resources:
          requests:
            storage: 20Gi
