server {
    listen 443 ssl http2;
    server_name autocode.allcam.com.cn;

    ssl_certificate /etc/lucky-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LuckyEdgeTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/lucky_edge_access.log;
    error_log /var/log/nginx/lucky_edge_error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /v1/models {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19085;
    }

    location ~ ^/(?:v1/)?(?:chat/completions|completions|embeddings|responses|responses/compact|messages|moderations|images/(?:generations|edits|variations)|audio/(?:speech|transcriptions|translations)|rerank)$ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19085;
    }

    location = /v1/messages/count_tokens {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19085;
    }

    location = /v2/rerank {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19085;
    }

    location ~ ^/(?:v1beta/)?models/[^/]+:(?:generateContent|streamGenerateContent)$ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19085;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    server_name pdep.allcam.com.cn;

    ssl_certificate /etc/lucky-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LuckyEdgeTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/lucky_edge_access.log;
    error_log /var/log/nginx/lucky_edge_error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host pdep.allcam.com.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /api/v1/auth/sso/status {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/sso/login {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/sso/callback {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/sso/exchange {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/refresh {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/me {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/auth/logout {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location ^~ /api/v1/me/ {
        limit_except GET POST PUT {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/public/runtime-config {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/ranking/personal {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/ranking/team {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/ranking/team/current {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location = /api/v1/efficiency/data-dashboard {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19079;
    }

    location ~* ^/api/ {
        return 404;
    }

    location / {
        proxy_set_header Accept-Encoding "";
        proxy_pass http://127.0.0.1:19079;
        sub_filter_types application/javascript text/css;
        sub_filter_once off;
        sub_filter 'http://autocode.allcam.org' 'https://autocode.allcam.com.cn';
    }
}
