map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/lucky-edge/default-tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/default-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 80;
    server_name pm-agent.allcam.com.cn pms.allcam.com.cn sso.allcam.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/lucky-edge/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pm-agent.allcam.com.cn;

    ssl_certificate /etc/lucky-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LuckyEdgeTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/lucky_edge_access.log;
    error_log /var/log/nginx/lucky_edge_error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/(api|health|ready)(/|$) {
        proxy_pass http://127.0.0.1:19081;
    }

    location / {
        proxy_pass http://127.0.0.1:19080;
    }
}

server {
    listen 443 ssl http2;
    server_name pms.allcam.com.cn;

    ssl_certificate /etc/lucky-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LuckyEdgeTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/lucky_edge_access.log;
    error_log /var/log/nginx/lucky_edge_error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/agent-bridge/ws {
        proxy_pass http://127.0.0.1:19084;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:19084;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:19084;
    }

    location /readyz {
        proxy_pass http://127.0.0.1:19084;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:19082;
    }
}

server {
    listen 443 ssl http2;
    server_name sso.allcam.com.cn;

    ssl_certificate /etc/lucky-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/lucky-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LuckyEdgeTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    access_log /var/log/nginx/lucky_edge_access.log;
    error_log /var/log/nginx/lucky_edge_error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:19083;
    }
}
